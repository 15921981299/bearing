name: CI

# Cloudflare deploys this site through its own Git integration.
# This workflow only verifies the commit — it never deploys.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type and template check
        run: pnpm run check

      - name: Format check
        run: pnpm run format:check

      - name: Publish-readiness audit
        run: pnpm run audit:publish

      - name: Build
        run: pnpm run build

      - name: Internal link check
        run: pnpm run check:links
